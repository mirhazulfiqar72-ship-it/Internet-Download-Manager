name: Build Windows Installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build portable application
        run: cmd /c BUILD_EXE.bat
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Control Panel installer
        shell: pwsh
        run: |
          $iscc = (Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' | Select-Object -First 1).FullName
          & $iscc installer\InternetDownloadManager.iss
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: InternetDownloadManager-Windows-Installer
          path: installer-output\InternetDownloadManager_Setup.exe
          if-no-files-found: error
