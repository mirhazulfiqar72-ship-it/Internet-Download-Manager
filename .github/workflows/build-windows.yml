name: Build Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Verify UI behavior
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/smoke_ui.py
          python tests/test_tray_updates.py
          python tests/test_download_engine.py
          python tests/test_options_dialog.py
      - name: Verify media extraction dependencies
        run: python tests/test_media_runtime.py
      - name: Build portable application
        run: cmd /c BUILD_EXE.bat
      - name: Bundle YouTube JavaScript runtime
        shell: pwsh
        run: |
          Copy-Item (Get-Command node.exe).Source dist/InternetDownloadManager/node.exe
          Invoke-WebRequest https://raw.githubusercontent.com/nodejs/node/v22.x/LICENSE -OutFile dist/InternetDownloadManager/NODE-LICENSE.txt
          python tests/test_packaged_media.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Control Panel installer
        shell: pwsh
        run: |
          $iscc = (Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' | Select-Object -First 1).FullName
          & $iscc installer\InternetDownloadManager.iss
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: InternetDownloadManager-Windows-Installer
          path: installer-output\InternetDownloadManager_Setup.exe
          if-no-files-found: error


      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = python -c "from idm.release import VERSION; print(VERSION)"
          gh release create "v$version" installer-output/InternetDownloadManager_Setup.exe --target "$env:GITHUB_SHA" --title "Internet Download Manager $version" --notes "Add compact nine-tab Options dialog (General, File Types, Save To, Downloads, Connection, Proxy / Socks, Site logins, Dial-Up / VPN and Sounds) with persisted settings and download integration." --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
